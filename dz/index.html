<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Parempi Hyppykeli</title>
        <link rel="stylesheet" href="/styles.css" />
        <link rel="stylesheet" href="/vendor/build/leaflet.css" />
        <link rel="preconnect" href="https://opendata.fmi.fi/" />

        <link rel="icon" href="/assets/icon.png" />
        <link rel="manifest" href="/manifest.json" />
        <link
            rel="apple-touch-icon"
            sizes="72x72"
            href="/assets/apple-72x72.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="144x144"
            href="/assets/apple-144x144.png"
        />

        <script type="importmap">
            {
                "imports": {
                    "#app/": "/src/",
                    "@preact/signals": "/vendor/build/preact-signals.js",
                    "preact/hooks": "/vendor/build/preact-hooks.js",
                    "htm/preact": "/vendor/build/htm.js",
                    "preact": "/vendor/build/preact.js",
                    "chart.js": "/vendor/build/chart.js",
                    "leaflet": "/vendor/build/leaflet.js"
                }
            }
        </script>
        <!-- preload to avoid request waterfalls -->
        <link rel="modulepreload" href="/src/weather/state.js" />
        <link rel="modulepreload" href="/src/weather/refresh.js" />
        <link rel="modulepreload" href="/src/shared/dates.js" />
        <link rel="modulepreload" href="/src/weather/Graph.js" />
        <link rel="modulepreload" href="/src/weather/Compass.js" />
        <link rel="modulepreload" href="/vendor/build/htm.js" />
        <link rel="modulepreload" href="/vendor/build/preact-hooks.js" />
        <link rel="modulepreload" href="/vendor/build/preact-signals.js" />
        <link rel="modulepreload" href="/vendor/build/chart.js" />
        <link rel="modulepreload" href="/vendor/build/leaflet.js" />
        <script type="module">
            // init the app
            import { App } from "#app/app/App.js";
            import { startApp } from "#app/app/start.js";
            import { render, h } from "preact";
            startApp();
            const root = document.getElementById("root");
            render(h(App), root);
        </script>
    </head>
    <body>
        <div id="root"></div>
        <!-- Cloudflare Web Analytics -->
        <script
            defer
            src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "1304ee016ec7490dae27ff65a7d153c5"}'
        ></script>
        <!-- End Cloudflare Web Analytics -->
    </body>
</html>
